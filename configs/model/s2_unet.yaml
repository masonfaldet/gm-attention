kind: s2_unet
architecture:
  _target_: torch_harmonics.examples.models.SphericalUNet
  grid: equiangular
  grid_internal: equiangular
  embed_dims:
  - 16
  - 32
  - 64
  - 128
  depths:
  - 2
  - 2
  - 2
  - 2
  scale_factor: 2
  activation_function: gelu
  kernel_shape:
  - 5
  - 4
  filter_basis_type: piecewise linear
  drop_path_rate: 0.1
  drop_conv_rate: 0.2
  drop_dense_rate: 0.5
  transform_skip: false
  upsampling_mode: conv
  downsampling_mode: conv
