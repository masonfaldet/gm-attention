grid:
  subdivisions: 5
kind: gm_attention_depth1
architecture:
  _target_: experiments.shallow_water.models.GmAttentionDepth1
  base_field_type:
    0: 1
    1: 1
  multiplicity: 26
  num_layers: 4
  num_heads: 2
  ffn_multiplier: 2
  encode_mode: learned_integral
  deep_cutoff: 0.27571504347419135
