kind: s2_segformer
architecture:
  _target_: torch_harmonics.examples.models.SphericalSegformer
  grid: equiangular
  grid_internal: equiangular
  embed_dims:
  - 16
  - 32
  - 64
  - 128
  heads:
  - 1
  - 2
  - 4
  - 8
  depths:
  - 3
  - 4
  - 6
  - 3
  scale_factor: 2
  activation_function: gelu
  kernel_shape:
  - 5
  - 4
  filter_basis_type: piecewise linear
  mlp_ratio: 4.0
  att_drop_rate: 0.0
  drop_path_rate: 0.1
  attention_mode: neighborhood
  bias: false
