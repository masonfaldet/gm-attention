defaults:
  - data: swe_128x256
  - grid: icosphere_l5
  - model: d1_attention_full
  - objective: residual
  - training: default
  - _self_

hydra:
  searchpath:
    - file://configs
  job:
    chdir: true
  run:
    dir: outputs/SWE_128x256_Benchmark/gm_attention_depth1/seed${seed}

seed: 0
device: null

training:
  max_epochs: 100
  lr: 1.2e-2
  early_stopping_patience: null
