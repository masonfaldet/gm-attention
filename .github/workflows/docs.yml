# Build the documentation site with MkDocs and publish it to GitHub Pages on every push to main. Only the
# docs group is installed: mkdocstrings reads the sources statically, so torch is not needed. Enable Pages
# for the repository (Settings > Pages > Source: GitHub Actions) once, then this workflow deploys.
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install the docs group only
        run: uv sync --locked --only-group docs --no-install-project
      - name: Build the site
        run: uv run --no-sync mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
